<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ฝากงาน 📋 ละกอน & คาเฟ่</title>

  <!-- ⚠️ แก้ค่าด้านล่างให้ตรงกับ GAS Web App ที่ deploy สำหรับรับงาน -->
  <script>
    // ใช้ตัวเดียวกับแอปสั่งน้ำได้ ถ้า GAS รองรับ action:"submitRequest"
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxzC5ANdXjsxwSZyB6nuVV2dMloXAKHJwQAVRackLAL_mb8OgkepkveGsk1RaYIzS5OBw/exec";
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy: #1B3558;
      --navy-dark: #122540;
      --navy-light: #EAF0F7;
      --gold: #C8A96E;
      --gold-light: #F5EDD9;
      --teal: #5B9BA0;
      --teal-light: #E0EEEF;
      --cream: #F8F5EF;
      --cream-dark: #EDE8DB;
      --text: #1B2B3B;
      --sub: #7A8A9B;
      --border: #D8D0C4;
      --white: #FFFFFF;
      --green: #3D9970;
      --orange: #C8842A;
      --red: #C0392B;
      --radius: 12px;
    }

    body {
      font-family: 'Sarabun', -apple-system, sans-serif;
      background: var(--cream);
      color: var(--text);
      line-height: 1.55;
      min-height: 100vh;
      padding-bottom: 40px;
    }

    .header {
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-dark) 100%);
      color: var(--white);
      padding: 28px 20px 24px;
      text-align: center;
      border-bottom: 3px solid var(--gold);
    }
    .header h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 4px; }
    .header p { font-size: .9rem; color: var(--gold-light); font-weight: 300; }

    .container { max-width: 560px; margin: 0 auto; padding: 20px 16px; }

    .card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 18px;
      margin-bottom: 16px;
      box-shadow: 0 2px 10px rgba(27,53,88,.05);
    }

    .field { margin-bottom: 16px; }
    .field:last-child { margin-bottom: 0; }
    label {
      display: block;
      font-size: .9rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--navy);
    }
    label .req { color: var(--red); }
    .hint { font-size: .78rem; color: var(--sub); font-weight: 400; margin-top: 4px; }

    input[type="text"], input[type="tel"], input[type="date"], textarea, select {
      width: 100%;
      font-family: inherit;
      font-size: 1rem;
      color: var(--text);
      background: var(--cream);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 11px 13px;
      transition: border-color .15s, background .15s;
    }
    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--teal);
      background: var(--white);
    }
    textarea { resize: vertical; min-height: 96px; }

    .seg { display: flex; gap: 8px; flex-wrap: wrap; }
    .seg input { position: absolute; opacity: 0; pointer-events: none; }
    .seg label {
      flex: 1 1 auto;
      min-width: 90px;
      text-align: center;
      margin: 0;
      padding: 10px 8px;
      background: var(--cream);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      font-weight: 500;
      color: var(--sub);
      transition: all .15s;
    }
    .seg input:checked + label {
      background: var(--navy-light);
      border-color: var(--navy);
      color: var(--navy);
      font-weight: 600;
    }
    /* urgency colors */
    #urg-high:checked + label   { background:#FBE9E7; border-color:var(--red);    color:var(--red); }
    #urg-normal:checked + label { background:#FFF3E0; border-color:var(--orange); color:var(--orange); }
    #urg-low:checked + label    { background:#E8F5EC; border-color:var(--green);  color:var(--green); }

    .files-preview { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .thumb {
      position: relative; width: 72px; height: 72px;
      border-radius: 8px; overflow: hidden; border: 1px solid var(--border);
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .thumb button {
      position: absolute; top: 2px; right: 2px;
      width: 20px; height: 20px; border: none; border-radius: 50%;
      background: rgba(0,0,0,.6); color: #fff; font-size: .8rem;
      cursor: pointer; line-height: 1; display: flex; align-items: center; justify-content: center;
    }
    .upload-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 10px 16px; background: var(--teal-light); color: var(--teal);
      border: 1.5px dashed var(--teal); border-radius: 10px;
      cursor: pointer; font-weight: 600; font-size: .9rem;
    }
    .upload-btn input { display: none; }

    .submit-btn {
      width: 100%; padding: 15px;
      background: linear-gradient(135deg, var(--gold) 0%, #B8955C 100%);
      color: var(--navy-dark); font-family: inherit; font-size: 1.05rem; font-weight: 700;
      border: none; border-radius: 12px; cursor: pointer;
      box-shadow: 0 4px 14px rgba(200,169,110,.35);
      transition: transform .1s, box-shadow .15s;
    }
    .submit-btn:hover { box-shadow: 0 6px 18px rgba(200,169,110,.45); }
    .submit-btn:active { transform: translateY(1px); }
    .submit-btn:disabled { opacity: .6; cursor: not-allowed; }

    .msg { text-align: center; font-size: .88rem; margin-top: 12px; min-height: 20px; }
    .msg.err { color: var(--red); }

    /* success screen */
    .success { text-align: center; padding: 40px 20px; }
    .success .check {
      width: 72px; height: 72px; margin: 0 auto 16px;
      background: var(--green); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 2.2rem; color: #fff;
    }
    .success h2 { color: var(--navy); margin-bottom: 8px; }
    .success p { color: var(--sub); margin-bottom: 6px; }
    .success .ref {
      display: inline-block; margin: 12px 0;
      background: var(--navy-light); color: var(--navy);
      font-weight: 700; font-size: 1.1rem;
      padding: 8px 18px; border-radius: 10px; letter-spacing: .5px;
    }
    .link-btn {
      display: inline-block; margin-top: 14px; color: var(--teal);
      font-weight: 600; text-decoration: none; cursor: pointer;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="header">
    <h1>📋 ฝากงาน / แจ้งงาน</h1>
    <p>โรงน้ำละกอน 💧 &amp; คาเฟ่ ☕ — กรอกรายละเอียดเพื่อให้จัดสรรงานได้ไว</p>
  </div>

  <div class="container">
    <!-- ===== ฟอร์ม ===== -->
    <form id="form" novalidate>
      <div class="card">
        <div class="field">
          <label>ชื่อผู้ฝากงาน <span class="req">*</span></label>
          <input type="text" id="name" placeholder="เช่น คุณเอ / ร้านค้า / แผนกจัดส่ง" />
        </div>
        <div class="field">
          <label>ช่องทางติดต่อกลับ <span class="req">*</span></label>
          <input type="text" id="contact" placeholder="เบอร์โทร หรือ LINE ID" />
          <div class="hint">เผื่อต้องสอบถามรายละเอียดเพิ่ม</div>
        </div>
      </div>

      <div class="card">
        <div class="field">
          <label>งานนี้เกี่ยวกับธุรกิจไหน <span class="req">*</span></label>
          <div class="seg" id="bizSeg">
            <input type="radio" name="biz" id="biz-water" value="โรงน้ำละกอน" />
            <label for="biz-water">💧 โรงน้ำ</label>
            <input type="radio" name="biz" id="biz-cafe" value="คาเฟ่" />
            <label for="biz-cafe">☕ คาเฟ่</label>
            <input type="radio" name="biz" id="biz-other" value="อื่นๆ/ทั้งคู่" />
            <label for="biz-other">🔀 อื่นๆ</label>
          </div>
        </div>

        <div class="field">
          <label>ประเภทงาน</label>
          <select id="type">
            <option value="">— เลือกประเภท —</option>
            <option>สั่งซื้อ / ออเดอร์</option>
            <option>จัดส่ง / ขนส่ง</option>
            <option>การเงิน / บิล / ใบเสร็จ</option>
            <option>ซ่อม / อุปกรณ์ / สต็อก</option>
            <option>การตลาด / คอนเทนต์ / โปรโมชั่น</option>
            <option>ลูกค้า / ร้องเรียน / สอบถาม</option>
            <option>เอกสาร / ประสานงาน</option>
            <option>อื่นๆ</option>
          </select>
        </div>

        <div class="field">
          <label>รายละเอียดงาน <span class="req">*</span></label>
          <textarea id="detail" placeholder="อธิบายให้ชัดว่าต้องการให้ทำอะไร ที่ไหน จำนวนเท่าไหร่ ฯลฯ"></textarea>
        </div>
      </div>

      <div class="card">
        <div class="field">
          <label>ความเร่งด่วน <span class="req">*</span></label>
          <div class="seg">
            <input type="radio" name="urg" id="urg-high" value="ด่วนมาก" />
            <label for="urg-high">🔴 ด่วนมาก</label>
            <input type="radio" name="urg" id="urg-normal" value="ปกติ" checked />
            <label for="urg-normal">🟠 ปกติ</label>
            <input type="radio" name="urg" id="urg-low" value="ไม่เร่ง" />
            <label for="urg-low">🟢 ไม่เร่ง</label>
          </div>
        </div>
        <div class="field">
          <label>ต้องการภายในวันที่ (ถ้ามี)</label>
          <input type="date" id="due" />
        </div>
        <div class="field">
          <label>แนบรูป (ถ้ามี)</label>
          <label class="upload-btn">
            📎 เลือกรูป
            <input type="file" id="files" accept="image/*" multiple />
          </label>
          <div class="hint">แนบได้หลายรูป ระบบจะย่อขนาดให้อัตโนมัติ</div>
          <div class="files-preview" id="preview"></div>
        </div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">ส่งงาน 📨</button>
      <div class="msg" id="msg"></div>
    </form>

    <!-- ===== หน้าสำเร็จ ===== -->
    <div class="success hidden" id="successScreen">
      <div class="check">✓</div>
      <h2>ส่งงานเรียบร้อย!</h2>
      <p>ได้รับเรื่องของคุณแล้ว จะรีบดำเนินการให้ครับ</p>
      <div class="ref" id="refCode">#—</div>
      <p style="font-size:.82rem;">บันทึกเลขงานนี้ไว้เผื่อสอบถามภายหลัง</p>
      <br />
      <a class="link-btn" id="againBtn">+ ฝากงานใหม่อีกครั้ง</a>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    let images = []; // { name, dataUrl }

    // ---------- แนบรูป + ย่อขนาด ----------
    $('files').addEventListener('change', async (e) => {
      const list = Array.from(e.target.files || []);
      for (const file of list) {
        if (!file.type.startsWith('image/')) continue;
        try {
          const dataUrl = await compressImage(file, 1000, 0.7);
          images.push({ name: file.name, dataUrl });
        } catch (_) {}
      }
      e.target.value = '';
      renderPreview();
    });

    function compressImage(file, maxSize, quality) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            let { width, height } = img;
            if (width > maxSize || height > maxSize) {
              if (width >= height) { height = Math.round(height * maxSize / width); width = maxSize; }
              else { width = Math.round(width * maxSize / height); height = maxSize; }
            }
            const canvas = document.createElement('canvas');
            canvas.width = width; canvas.height = height;
            canvas.getContext('2d').drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = reject;
          img.src = reader.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function renderPreview() {
      const box = $('preview');
      box.innerHTML = '';
      images.forEach((im, i) => {
        const d = document.createElement('div');
        d.className = 'thumb';
        d.innerHTML = `<img src="${im.dataUrl}" alt=""><button type="button" data-i="${i}">×</button>`;
        box.appendChild(d);
      });
      box.querySelectorAll('button').forEach((b) => {
        b.onclick = () => { images.splice(+b.dataset.i, 1); renderPreview(); };
      });
    }

    // ---------- ส่งข้อมูล ----------
    async function apiPost(body) {
      // GAS Web App: ส่งแบบ POST text/plain เพื่อเลี่ยง CORS preflight
      const res = await fetch(GAS_URL, {
        method: 'POST',
        redirect: 'follow',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(body),
      });
      return res.json();
    }

    $('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = $('msg');
      msg.className = 'msg';
      msg.textContent = '';

      const name = $('name').value.trim();
      const contact = $('contact').value.trim();
      const biz = (document.querySelector('input[name="biz"]:checked') || {}).value || '';
      const detail = $('detail').value.trim();
      const urg = (document.querySelector('input[name="urg"]:checked') || {}).value || '';

      if (!name || !contact || !biz || !detail || !urg) {
        msg.className = 'msg err';
        msg.textContent = 'กรุณากรอกช่องที่มี * ให้ครบ (ชื่อ / ติดต่อ / ธุรกิจ / รายละเอียด / ความเร่งด่วน)';
        return;
      }

      const payload = {
        action: 'submitRequest',
        name, contact, biz,
        type: $('type').value || '',
        detail,
        urgency: urg,
        due: $('due').value || '',
        images: images.map((im) => im.dataUrl),
        submittedAt: new Date().toISOString(),
      };

      const btn = $('submitBtn');
      btn.disabled = true;
      btn.textContent = 'กำลังส่ง...';
      try {
        const res = await apiPost(payload);
        const ref = (res && (res.ref || res.id)) || genLocalRef();
        $('refCode').textContent = '#' + ref;
        $('form').classList.add('hidden');
        $('successScreen').classList.remove('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } catch (err) {
        // ส่งไม่สำเร็จ (เช่น GAS ยังไม่ตั้งค่า) — ยังถือว่าบันทึกฝั่ง client ได้
        msg.className = 'msg err';
        msg.textContent = 'ส่งไม่สำเร็จ กรุณาลองใหม่ หรือแจ้งผู้ดูแลระบบ (ยังไม่ได้เชื่อม GAS?)';
      } finally {
        btn.disabled = false;
        btn.textContent = 'ส่งงาน 📨';
      }
    });

    function genLocalRef() {
      const d = new Date();
      const p = (n) => String(n).padStart(2, '0');
      return 'REQ' + d.getFullYear().toString().slice(2) + p(d.getMonth()+1) + p(d.getDate())
             + '-' + Math.floor(Math.random()*9000+1000);
    }

    $('againBtn').addEventListener('click', () => {
      $('form').reset();
      images = [];
      renderPreview();
      $('successScreen').classList.add('hidden');
      $('form').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  </script>
</body>
</html>
