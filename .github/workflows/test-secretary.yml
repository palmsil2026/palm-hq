# ทดสอบคุณเลขาทุกครั้งที่มี PR/merge แตะ secretary/ — เห็นผลก่อนกด merge (ไม่ deploy อะไร)
name: Test secretary

on:
  pull_request:
    paths: ['secretary/**', '.github/workflows/test-secretary.yml']
  push:
    branches: [main]
    paths: ['secretary/**']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: เทสต์เส้นทาง (โค้ดจริง + GAS/LINE จำลอง)
        run: node secretary/test/unit.test.js
      - name: ข้อสอบสถานการณ์ส่วนที่ไม่ใช้สมอง
        run: node secretary/test/brain-eval.js check-routes
