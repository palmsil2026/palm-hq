# ============================================================
#  Deploy คุณเลขาขึ้น Google Apps Script อัตโนมัติ
#  ทำงานเมื่อ: secretary/Code.gs เข้า main  หรือกดปุ่ม "Run workflow" เองในหน้า Actions
#  ต้องมี Secret ชื่อ CLASPRC_JSON = เนื้อไฟล์ ~/.clasprc.json ของเจ้าของบัญชี (ตัวเดียวกับ origin-hq)
#  กลไกเดียวกับ origin-hq (พิสูจน์แล้ว 60+ รอบ) — รายละเอียด/วิธีถอนสิทธิ์: DEPLOY.md
# ============================================================
name: Deploy to Apps Script

on:
  push:
    branches: [main]
    paths:
      - 'secretary/Code.gs'
      - '.github/scripts/deploy-secretary.sh'
  workflow_dispatch:

# สอง push ติดกัน = ต่อคิว ไม่ redeploy ชนกันกลางคัน
concurrency:
  group: deploy-gas
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: ดึงโค้ด
        uses: actions/checkout@v5

      - name: ติดตั้ง Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: ตรวจไวยากรณ์ Code.gs ก่อนส่ง
        run: |
          cp secretary/Code.gs /tmp/secretary.js
          node --check /tmp/secretary.js || { echo "::error::secretary/Code.gs ไวยากรณ์ผิด — ไม่ส่งขึ้น"; exit 1; }
          echo "  ✓ secretary/Code.gs"
          grep -qE "^const CODE_VERSION = '" secretary/Code.gs || { echo "::error::ไม่เจอ CODE_VERSION ใน Code.gs"; exit 1; }

      - name: ทดสอบเส้นทางเลขา (ล้ม = ไม่ส่งขึ้น)
        run: node secretary/test/unit.test.js

      - name: ติดตั้ง clasp
        run: npm install -g @google/clasp@3.4.0

      - name: ใส่ token ของเจ้าของบัญชี (จาก GitHub Secret)
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::ยังไม่ได้ตั้ง Secret ชื่อ CLASPRC_JSON — ดูวิธีใน DEPLOY.md"
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: deploy
        run: bash .github/scripts/deploy-secretary.sh

      - name: ลบ token ทิ้ง
        if: always()
        run: rm -f "$HOME/.clasprc.json"
